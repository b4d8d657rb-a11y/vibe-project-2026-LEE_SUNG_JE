<!DOCTYPE html>
<html lang="ko" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nothing 계정에 로그인하거나 새 계정을 만드세요.">
    <meta property="og:title" content="로그인 및 회원가입 | Nothing">
    <meta property="og:description" content="Nothing 계정에 로그인하거나 새 계정을 만드세요.">
    <title>로그인 및 회원가입 | Nothing</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/auth.css">
  </head>
  <body class="auth-page">
    <main>
      <section class="auth-page__section" aria-labelledby="auth-title">
        <div class="inner-box">
          <div class="partition-box partition-box--center">
            <div class="content-box auth-page__content">
              <header class="auth-page__header">
                <a class="auth-page__brand" href="../index.html" aria-label="Nothing 홈">
                  <img src="../images/d/logo.svg" alt="NOTHING" width="106" height="14">
                </a>
                <button class="auth-page__close" type="button" data-auth-close>창 닫기</button>
              </header>
              <h1 class="auth-page__title" id="auth-title">로그인</h1>
              <div class="auth-page__view" data-login-view>
                <form class="auth-form" data-login-form>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="login-id">아이디</label>
                    <input class="auth-form__input" id="login-id" name="id" type="text" autocomplete="username" required>
                  </div>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="login-password">비밀번호</label>
                    <input class="auth-form__input" id="login-password" name="password" type="password" autocomplete="current-password" required>
                  </div>
                  <button class="auth-form__submit" type="submit">로그인</button>
                </form>
                <button class="auth-page__switch" type="button" data-show-signup>회원가입</button>
              </div>
              <section class="auth-signup" aria-labelledby="auth-title" data-signup-view hidden>
                <p class="auth-signup__description">새 Nothing 계정을 만드세요.</p>
                <form class="auth-form" data-signup-form>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="signup-name">이름</label>
                    <input class="auth-form__input" id="signup-name" name="name" type="text" autocomplete="name" maxlength="40" required>
                  </div>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="signup-id">아이디</label>
                    <input class="auth-form__input" id="signup-id" name="id" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9._-]{3,20}" aria-describedby="signup-id-hint" required>
                    <p class="auth-form__hint" id="signup-id-hint">영문, 숫자, 마침표, 밑줄, 하이픈으로 3~20자 입력해 주세요.</p>
                  </div>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="signup-password">비밀번호</label>
                    <input class="auth-form__input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" aria-describedby="signup-password-hint" required>
                    <p class="auth-form__hint" id="signup-password-hint">Firebase 정책에 따라 6자 이상 입력해 주세요.</p>
                  </div>
                  <div class="auth-form__field">
                    <label class="auth-form__label" for="signup-email">이메일</label>
                    <input class="auth-form__input" id="signup-email" name="email" type="email" autocomplete="email" required>
                  </div>
                  <button class="auth-form__submit" type="submit">회원가입</button>
                </form>
                <button class="auth-page__switch" type="button" data-show-login>로그인으로 돌아가기</button>
              </section>
              <p class="auth-page__message" data-auth-message role="status" aria-live="polite" hidden></p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="../js/modules/auth-page.js"></script>
  </body>
</html>
