<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰. NOTHING Headphone (1) Pro를 만나보세요.">
    <meta property="og:title" content="NOTHING Headphone (1) Pro">
    <meta property="og:description" content="스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰.">
    <title>NOTHING Headphone (1) Pro</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="site-header">
      <div class="inner-box">
        <div class="partition-box partition-box--center">
          <div class="content-box header__content">
            <a class="visually-hidden" href="#main-content">본문 바로가기</a>
            <div class="partition-box partition-box--horizontal partition-box--between partition-box--center">
              <span class="header__menu-mark" aria-hidden="true">≡</span>
              <p class="header__brand">NOTHING ®</p>
              <span class="header__balance" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="section section--hero" aria-labelledby="hero-title">
        <div class="inner-box inner-box--fill">
          <div class="partition-box partition-box--center partition-box--fill">
            <div class="content-box content-box--fill hero__content">
              <div class="hero__visual" id="hero-product" role="img" aria-label="헤드폰 이미지 영역">
                <span class="hero__headband" aria-hidden="true"></span>
                <span class="hero__stem" aria-hidden="true"></span>
                <span class="hero__earcup" aria-hidden="true">
                  <span class="hero__earcup-core">
                    <span class="hero__earcup-center"></span>
                  </span>
                </span>
              </div>
              <div class="hero__copy">
                <p class="hero__label">HEADPHONE (1) PRO</p>
                <h1 class="hero__title" id="hero-title">스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰.</h1>
                <a class="button hero__action" href="#hero-product">
                  자세히 보기
                  <span class="button__arrow" aria-hidden="true">›</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner-box">
        <div class="partition-box">
          <div class="content-box footer__brand">NOTHING ®</div>
        </div>
      </div>
    </footer>
  </body>
</html>
