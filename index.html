<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰. NOTHING Headphone (1) Pro를 만나보세요.">
    <meta property="og:title" content="NOTHING Headphone (1) Pro">
    <meta property="og:description" content="스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰.">
    <title>NOTHING Headphone (1) Pro</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header class="site-header">
      <div class="inner-box">
        <div class="partition-box partition-box--center">
          <div class="content-box header__content">
            <a class="visually-hidden" href="#main-content">본문 바로가기</a>
            <button
              class="header__menu-button"
              type="button"
              aria-label="전체 메뉴 열기"
              aria-controls="site-menu"
              aria-expanded="false"
              data-menu-toggle>
              <img class="header__menu-mark" src="images/d/hbg.svg" alt="" aria-hidden="true" width="16" height="16">
            </button>
            <a class="header__brand" href="#main-content" aria-label="NOTHING 홈">
              <img class="header__brand-logo" src="images/d/logo.svg" alt="NOTHING" width="106" height="14">
            </a>
            <span class="header__balance" aria-hidden="true"></span>

            <nav class="site-menu" id="site-menu" aria-label="전체 메뉴" aria-hidden="true" inert>
              <div class="site-menu__panel">
                <div class="site-menu__header">
                  <button
                    class="site-menu__close"
                    type="button"
                    aria-label="전체 메뉴 닫기"
                    data-menu-close>
                    <img
                      class="site-menu__close-mark"
                      src="images/d/menu_1.svg"
                      alt=""
                      aria-hidden="true"
                      width="16"
                      height="16">
                  </button>
                  <a class="site-menu__brand" href="#main-content" aria-label="NOTHING 홈">
                    <img src="images/d/logo.svg" alt="" aria-hidden="true" width="106" height="14">
                  </a>
                </div>

                <div class="site-menu__content">
                  <ul class="site-menu__categories">
                    <li><a class="site-menu__category" href="#hero" data-menu-link>모든 제품</a></li>
                    <li><a class="site-menu__category" href="#hero" data-menu-link>휴대전화</a></li>
                    <li><a class="site-menu__category" href="#hero" data-menu-link>오디오</a></li>
                    <li><a class="site-menu__category" href="#hero" data-menu-link>시계</a></li>
                    <li><a class="site-menu__category" href="#hero" data-menu-link>액세서리</a></li>
                  </ul>
                  <div class="site-menu__signature" aria-label="CMF, NOTHING OS 5.0">
                    <span class="site-menu__cmf" aria-hidden="true">CMF</span>
                    <span class="site-menu__slogan" aria-hidden="true">NOTHING OS 5.0</span>
                  </div>
                </div>

                <nav class="site-menu__footer" aria-label="추가 링크">
                  <ul class="site-menu__links">
                    <li><a class="site-menu__link" href="#hero" data-menu-link>ACCOUNT</a></li>
                    <li><a class="site-menu__link" href="#hero" data-menu-link>지원</a></li>
                    <li><a class="site-menu__link" href="#hero" data-menu-link>COMMUNITY</a></li>
                    <li><a class="site-menu__link" href="#hero" data-menu-link>회사 소개</a></li>
                  </ul>
                </nav>
              </div>
            </nav>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content" id="main-content">
      <section class="section section--hero" id="hero" aria-labelledby="hero-title">
        <video
          class="main-video"
          poster="images/d/nothing-dt-4.jpg"
          width="1725"
          height="693"
          src="images/d/main_video.mp4"
          muted
          playsinline
          loop
          preload="metadata"
          data-main-video
          aria-hidden="true"
          tabindex="-1"></video>
        <div class="inner-box inner-box--fill">
          <div class="partition-box partition-box--center partition-box--fill">
            <div class="content-box content-box--fill hero__content">
              <button
                class="main-video__toggle visually-hidden"
                type="button"
                data-main-video-toggle>
                영상 일시정지
              </button>
              <div class="hero__copy">
                <p class="hero__label">HEADPHONE (1) PRO</p>
                <h1 class="hero__title" id="hero-title">스튜디오급 정밀함을 담은, 역대 가장 진보한 헤드폰.</h1>
                <a class="button hero__action" href="#hero">
                  자세히 보기
                  <img class="button__arrow" src="images/d/main.svg" alt="" aria-hidden="true" width="16" height="16">
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section section--category light" id="category" aria-labelledby="category-title">
        <div class="inner-box inner-box--category">
          <div class="partition-box partition-box--category">
            <div class="content-box content-box--category">
              <header class="category__header">
                <h2 class="category__title" id="category-title">카테고리별 쇼핑</h2>
              </header>
              <div class="category__grid" role="region" aria-label="제품 카테고리 목록">
                <article class="category-card">
                  <a class="category-card__media-link" href="#earphones" tabindex="-1" aria-hidden="true">
                    <div class="category-card__media">
                      <img
                        class="category-card__image"
                        src="images/d/nothing-dt-1.jpg"
                        alt="이어폰"
                        loading="lazy"
                        decoding="async"
                        width="1000"
                        height="1000">
                    </div>
                  </a>
                  <div class="category-card__info">
                    <a class="category-card__link" href="#earphones">
                      이어폰
                      <img class="category-card__arrow" src="images/d/card.svg" alt="" aria-hidden="true" width="16" height="16">
                    </a>
                  </div>
                </article>

                <article class="category-card">
                  <a class="category-card__media-link" href="#headphones" tabindex="-1" aria-hidden="true">
                    <div class="category-card__media">
                      <img
                        class="category-card__image"
                        src="images/d/nothing-dt-4.jpg"
                        alt="헤드폰"
                        loading="lazy"
                        decoding="async"
                        width="1000"
                        height="1000">
                    </div>
                  </a>
                  <div class="category-card__info">
                    <a class="category-card__link" href="#headphones">
                      헤드폰
                      <img class="category-card__arrow" src="images/d/card.svg" alt="" aria-hidden="true" width="16" height="16">
                    </a>
                  </div>
                </article>

                <article class="category-card">
                  <a class="category-card__media-link" href="#smartphones" tabindex="-1" aria-hidden="true">
                    <div class="category-card__media">
                      <img
                        class="category-card__image"
                        src="images/d/nothing-dt-18.jpg"
                        alt="스마트폰"
                        loading="lazy"
                        decoding="async"
                        width="1000"
                        height="1000">
                    </div>
                  </a>
                  <div class="category-card__info">
                    <a class="category-card__link" href="#smartphones">
                      스마트폰
                      <img class="category-card__arrow" src="images/d/card.svg" alt="" aria-hidden="true" width="16" height="16">
                    </a>
                  </div>
                </article>

                <article class="category-card">
                  <a class="category-card__media-link" href="#cmf" tabindex="-1" aria-hidden="true">
                    <div class="category-card__media">
                      <img
                        class="category-card__image"
                        src="images/d/nothing-dt-17.jpg"
                        alt="CMF"
                        loading="lazy"
                        decoding="async"
                        width="1000"
                        height="1000">
                    </div>
                  </a>
                  <div class="category-card__info">
                    <a class="category-card__link" href="#cmf">
                      CMF
                      <img class="category-card__arrow" src="images/d/card.svg" alt="" aria-hidden="true" width="16" height="16">
                    </a>
                  </div>
                </article>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner-box">
        <div class="partition-box">
          <div class="content-box footer__brand">NOTHING ®</div>
        </div>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
